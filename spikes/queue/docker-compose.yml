# T-P0-02 spike database. Bound to localhost only; throwaway volume.
services:
  pg:
    image: pgvector/pgvector:0.8.7-pg17
    environment:
      POSTGRES_USER: spike
      POSTGRES_PASSWORD: spike
      POSTGRES_DB: spike
    ports: ["127.0.0.1:55432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spike"]
      interval: 2s
      retries: 30
