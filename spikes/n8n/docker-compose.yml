# T-P0-03 n8n CE spike (throwaway). Editor on http://localhost:5679 (localhost only).
services:
  db:
    image: pgvector/pgvector:0.8.7-pg17
    environment: { POSTGRES_USER: n8n, POSTGRES_PASSWORD: n8n, POSTGRES_DB: n8n }
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U n8n"], interval: 2s, retries: 30 }

  n8n:
    image: n8nio/n8n:2.46.6
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: db
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: n8n
      N8N_ENCRYPTION_KEY: spike-only-not-secret
      GENERIC_TIMEZONE: Africa/Cairo
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      NODE_FUNCTION_ALLOW_BUILTIN: crypto        # checked: does the Code node allow crypto for HMAC?
      QOS_WEBHOOK_SECRET: spike-secret
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"       # 2.x blocks $env in Code nodes by default; without this the HMAC node errors
    volumes:
      - ./workflows:/workflows:ro
    ports: ["127.0.0.1:5679:5678"]
    depends_on: { db: { condition: service_healthy } }
